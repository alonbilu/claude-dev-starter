name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'

jobs:
  # One job, one command. `pnpm verify` is the same check the commands run locally
  # (scripts/verify.sh): lint, import boundaries, typecheck, test + coverage minimums, build.
  # Add checks to scripts/verify.sh, not here, so local and CI cannot drift apart.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5443:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5443/test
      DATABASE_URL_TEST: postgresql://test:test@localhost:5443/test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD, which scripts/verify.sh uses for `nx affected`.
      - uses: nrwl/nx-set-shas@v4

      - run: pnpm verify

# End-to-end tests are a separate workflow (.github/workflows/e2e.yml) that exists only when
# the `e2e` integration is enabled in PROJECT.md — see scripts/setup-quality-gates.js.
